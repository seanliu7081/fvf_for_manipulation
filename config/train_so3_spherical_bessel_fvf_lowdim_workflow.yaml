defaults:
  - _self_
  - task: drone_go_to 

name: train_so3_spherical_bessel_fvf_lowdim_policy
_target_: fvf.workflow.implicit_workflow.ImplicitWorkflow

obs_dim: ${task.obs_dim} 
action_dim: ${task.action_dim}
keypoint_dim: ${task.keypoint_dim}
task_name: ${task.name}
exp_name: 'so3_spherical_bessel'

horizon: 2
num_obs_steps: 2
num_action_steps: 1
num_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0
z_dim: 512

# SO3 MLP parameters
lmax: 3               # Max frequency in SO3MLP
N: 8                  # Number of discrete activation features

# Spherical Bessel parameters
n_max: 1              # Max Bessel order
l_max: 3              # Max spherical harmonic degree for basis
n_k: 5                # Number of radial frequencies
R_max: 1.0            # Max radius
scale_factor: 10.0    # Energy scale factor

action_coords: "spherical"

policy:
  _target_: fvf.policy.spherical_bessel_implicit_policy.SphericalBesselImplicitPolicy
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  num_obs_steps: ${num_obs_steps}
  num_action_steps: ${num_action_steps}
  num_neg_act_samples: 256
  pred_n_samples: 1000
  optimize_negatives: False 
  sample_actions: False 
  temperature: 1.0
  grad_pen: False

obs_encoder:
  _target_: fvf.model.implicit.obs_encoder.SO3KeypointEncoder
  num_keypoints: 3
  num_obs: ${num_obs_steps}
  in_feat: ${obs_dim}
  z_dim: ${z_dim}
  num_layers: 4
  lmax: ${lmax}
  N: ${N}
  dropout: 0.1

energy_head:
  _target_: fvf.model.implicit.energy_mlp.SO3SphericalBesselEnergyMLP
  obs_feat_dim: ${z_dim}
  mlp_dim: ${z_dim}
  num_layers: 4
  dropout: 0.1
  lmax: ${lmax}
  N: ${N}
  n_max: ${n_max}
  l_max: ${l_max}
  n_k: ${n_k}
  R_max: ${R_max}
  num_theta: 20
  scale_factor: ${scale_factor}

dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  betas: [0.95, 0.999]
  eps: 1e-8
  weight_decay: 1e-6

training:
  device: 'cuda:0'
  seed: 0
  resume: True
  lr_warmup_steps: 500
  num_epochs: 200
  checkpoint_every: 10
  rollout_every: 5
  val_every: 1
  tqdm_interval_sec: 1.0

logging:
  project: ${task_name}
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 2
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_checkpoint: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}